name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day at midnight UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # allows the workflow to commit and push

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats SVG
        run: |
          fetch_svg() {
            url="$1"
            out="$2"
            tmp=$(mktemp)
            if curl -sf "$url" -o "$tmp" && head -c 4 "$tmp" | grep -q "<svg\|<?xm"; then
              mv "$tmp" "$out"
              echo "OK: $out updated"
            else
              echo "WARN: fetch failed or invalid response for $out, keeping existing file"
              rm -f "$tmp"
            fi
          }

          # Primary source
          fetch_svg "https://github-readme-stats.vercel.app/api?username=Anshuu7781&show_icons=true&hide_border=true" stats.svg
          fetch_svg "https://github-readme-stats.vercel.app/api/top-langs/?username=Anshuu7781&layout=compact&hide_border=true" top-langs.svg

          # If primary failed (file still missing), try backup source
          if [ ! -s stats.svg ] || ! head -c 4 stats.svg | grep -q "<svg\|<?xm"; then
            fetch_svg "https://github-readme-stats-git-master-anuraghazra.vercel.app/api?username=Anshuu7781&show_icons=true&hide_border=true" stats.svg
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg top-langs.svg 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update stats"
          git push
