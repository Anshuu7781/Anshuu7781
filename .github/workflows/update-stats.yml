name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day at midnight UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # allows the workflow to commit and push

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats SVG
        run: |
          curl -s "https://github-readme-stats.vercel.app/api?username=Anshuu7781&show_icons=true&hide_border=true" -o stats.svg
          curl -s "https://github-readme-stats.vercel.app/api/top-langs/?username=Anshuu7781&layout=compact&hide_border=true" -o top-langs.svg

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg top-langs.svg
          git diff --staged --quiet || git commit -m "Update stats"
          git push
